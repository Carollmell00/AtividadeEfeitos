<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .example {
            width: 100px;
            height: 100px;
            margin: 16px;
            display: inline-block;
        }

        .example1 {
            background-color: red;
            animation: fadeColor 4s infinite alternate;
        }

        .example2 {
            position: relative;
            background-color: red;
            animation: moveSquare 4s infinite;
        }

        @keyframes fadeColor {
            from { background-color: red; }
            to { background-color: yellow; }
        }

        @keyframes moveSquare {
            0%   { background-color: red; left: 0px; top: 0px; }
            25%  { background-color: yellow; left: 200px; top: 0px; }
            50%  { background-color: blue; left: 200px; top: 200px; }
            75%  { background-color: green; left: 0px; top: 200px; }
            100% { background-color: red; left: 0px; top: 0px; }
        }
    </style>
</head>
<body>
    <h1>CSS Animation</h1>
    <section>
        <h2>Example 1: Fade color</h2>
        <div class="example example1"></div>
    </section>
    <section>
        <h2>Example 2: Moving box</h2>
        <div class="example example2"></div>
    </section>
    <p><b>Note:</b> When an animation is finished, it goes back to its original style unless you use `animation-fill-mode`.</p>
</body>
</html>
